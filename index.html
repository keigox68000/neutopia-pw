<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ニュートピア パスワード生成＆解析ツール</title>
<style>
  body { font-family: sans-serif; background: #1a1a2e; color: #eee; max-width: 720px; margin: 20px auto; padding: 0 16px; }
  h1 { font-size: 1.4rem; border-bottom: 2px solid #4ecca3; padding-bottom: 6px; }
  .card { background: #16213e; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  label { display: flex; flex-direction: column; font-size: 0.85rem; gap: 4px; }
  label.inline { flex-direction: row; align-items: center; gap: 6px; cursor: pointer; }
  input[type="number"], select, textarea { background: #0f3460; color: #fff; border: 1px solid #4ecca3; border-radius: 4px; padding: 6px; font-size: 0.95rem; }
  textarea { width: 100%; box-sizing: border-box; font-size: 1.2rem; letter-spacing: 0.15em; resize: none; }
  button { background: #4ecca3; color: #1a1a2e; border: none; border-radius: 4px; padding: 10px 18px; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
  button:hover { background: #3db890; }
  button.sub { background: #e94560; color: #fff; }
  .pw-box { font-size: 1.4rem; letter-spacing: 0.2em; background: #0f3460; padding: 14px; border-radius: 6px; text-align: center; font-weight: bold; color: #ffd369; margin: 10px 0; user-select: all; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .status { font-size: 0.85rem; color: #4ecca3; margin-top: 6px; }
  .status.err { color: #e94560; }
  h2 { font-size: 1rem; margin: 0 0 10px; color: #4ecca3; }
</style>
</head>
<body>
<h1>ニュートピア パスワード生成＆解析ツール</h1>

<div class="card">
  <h2>生成されたパスワード（24文字）</h2>
  <div id="pwOutput" class="pw-box"></div>
  <div class="row">
    <button onclick="generate()">パスワード生成（乱数更新）</button>
    <button onclick="setMax()" class="sub">最強プリセット</button>
    <button onclick="copyPw()">コピー</button>
  </div>
</div>

<div class="card">
  <h2>基本ステータス</h2>
  <div class="grid">
    <label>最大ライフ (5〜15)
      <input type="number" id="life" min="5" max="15" value="5">
    </label>
    <label>ゴールド (0〜999)
      <input type="number" id="gold" min="0" max="999" value="0">
    </label>
    <label>爆弾所持数 (0〜20)
      <input type="number" id="bombs" min="0" max="20" value="0">
    </label>
    <label>爆弾最大Lv (0〜3)
      <input type="number" id="bombMax" min="0" max="3" value="0">
    </label>
    <label>再開エリア ($358C: 0〜15)
      <input type="number" id="area" min="0" max="15" value="0">
    </label>
    <label>剣レベル (1〜4)
      <select id="sword">
        <option value="1">Lv1 (青銅)</option>
        <option value="2">Lv2 (鋼鉄)</option>
        <option value="3">Lv3 (炎)</option>
        <option value="0">Lv4 (最強)</option>
      </select>
    </label>
    <label>鎧レベル (1〜4)
      <select id="armor">
        <option value="1">Lv1</option>
        <option value="2">Lv2</option>
        <option value="3">Lv3</option>
        <option value="0">Lv4 (最強)</option>
      </select>
    </label>
    <label>盾レベル (1〜4)
      <select id="shield">
        <option value="1">Lv1</option>
        <option value="2">Lv2</option>
        <option value="3">Lv3</option>
        <option value="0">Lv4 (最強)</option>
      </select>
    </label>
  </div>
</div>

<div class="card">
  <h2>メダリオン（8個）</h2>
  <div class="grid" id="medallions"></div>
</div>

<div class="card">
  <h2>アイテム・装備フラグ</h2>
  <div class="grid">
    <label>薬 (0〜2)
      <input type="number" id="medicine" min="0" max="2" value="0">
    </label>
    <label class="inline"><input type="checkbox" id="it0"> 爆弾 ($2E44)</label>
    <label class="inline"><input type="checkbox" id="it2"> アイテム3 ($2E46)</label>
    <label class="inline"><input type="checkbox" id="it3"> アイテム4 ($2E47)</label>
    <label class="inline"><input type="checkbox" id="it4"> アイテム5 ($2E48)</label>
    <label class="inline"><input type="checkbox" id="it5"> アイテム6 ($2E49)</label>
    <label class="inline"><input type="checkbox" id="it6"> アイテム7 ($2E4A)</label>
    <label class="inline"><input type="checkbox" id="eq3"> 装備4 ($2E4F)</label>
    <label class="inline"><input type="checkbox" id="eq4"> 装備5 ($2E50)</label>
    <label class="inline"><input type="checkbox" id="eq5"> 装備6 ($2E51)</label>
    <label class="inline"><input type="checkbox" id="mapFlag"> 地図 ($2E54)</label>
    <label class="inline"><input type="checkbox" id="keyFlag"> 鍵 ($2E55)</label>
    <label class="inline"><input type="checkbox" id="spFlag"> 特殊フラグ ($E7)</label>
  </div>
</div>

<div class="card">
  <h2>既存パスワードの解析（デコード）</h2>
  <textarea id="pwInput" rows="2" placeholder="ここに24文字のひらがなパスワードを貼り付け（空白は無視されます）"></textarea>
  <div class="row">
    <button onclick="decodeInput()">パスワードを解析して反映</button>
  </div>
  <div id="decodeStatus" class="status"></div>
</div>

<script>
const CHARS = [
  'あ','い','う','え','お', 'か','き','く','け','こ',
  'さ','し','す','せ','そ', 'た','ち','つ','て','と',
  'な','に','ぬ','ね','の', 'は','ひ','ふ','へ','ほ',
  'ま','み','む','め','も', 'や','ゆ','よ','わ','ん',
  'ら','り','る','れ','ろ', 'が','ぎ','ぐ','げ','ご',
  'ざ','じ','ず','ぜ','ぞ', 'だ','ぢ','づ','で','ど',
  'ば','び','ぶ','べ'
];

// ROM 0xD8E5 - 0xD924 の64バイト暗号化テーブル
const TABLE = [
  0x1F,0x3A,0x06,0x3F,0x21,0x3F,0x30,0x37,0x1A,0x01,0x20,0x3F,0x35,0x03,0x29,0x2B,
  0x3E,0x3F,0x01,0x00,0x03,0x2C,0x37,0x07,0x3D,0x11,0x1E,0x34,0x3F,0x19,0x30,0x28,
  0x37,0x37,0x3C,0x0D,0x1E,0x31,0x0C,0x05,0x35,0x11,0x3F,0x24,0x3F,0x3B,0x3F,0x26,
  0x3B,0x33,0x3C,0x39,0x2E,0x3E,0x31,0x08,0x38,0x1F,0x00,0x37,0x19,0x24,0x12,0x0D
];

// メダリオンUI生成
const medDiv = document.getElementById('medallions');
for (let i = 0; i < 8; i++) {
  medDiv.innerHTML += `<label class="inline"><input type="checkbox" id="med${i}"> メダリオン ${i + 1}</label>`;
}

// ビットストリーム（ROMのLSR val -> ROL buf[x]を忠実に再現）
function createWriter() {
  const buf = new Array(24).fill(0);
  let idx = 0, bitRem = 5;
  return {
    buf,
    put(val, bits) {
      let v = val;
      for (let i = 0; i < bits; i++) {
        const c = v & 1;
        v >>= 1;
        buf[idx] = ((buf[idx] << 1) | c) & 0x3F;
        bitRem--;
        if (bitRem < 0) { bitRem = 5; idx++; }
      }
    }
  };
}

function createReader(buf) {
  const b = buf.slice();
  let idx = 23, bitRem = 5;
  return {
    get(bits) {
      let v = 0;
      for (let i = 0; i < bits; i++) {
        const c = b[idx] & 1;
        b[idx] >>= 1;
        v = (v << 1) | c;
        bitRem--;
        if (bitRem < 0) { bitRem = 5; idx--; }
      }
      return v;
    }
  };
}

function generate() {
  const w = createWriter();
  const rand6 = () => Math.floor(Math.random() * 64);

  const area = Math.min(15, Math.max(0, +document.getElementById('area').value || 0));
  const life = Math.min(15, Math.max(5, +document.getElementById('life').value || 5));
  const gold = Math.min(999, Math.max(0, +document.getElementById('gold').value || 0));
  const bombs = Math.min(20, Math.max(0, +document.getElementById('bombs').value || 0));
  const bombMax = Math.min(3, Math.max(0, +document.getElementById('bombMax').value || 0));
  const med = Math.min(2, Math.max(0, +document.getElementById('medicine').value || 0));

  // Block 0 (48 bits)
  w.put(rand6(), 6);
  w.put(area, 4);
  for (let i = 0; i < 8; i++) w.put(document.getElementById('med' + i).checked ? 1 : 0, 1);
  w.put(document.getElementById('it0').checked ? 1 : 0, 1);
  w.put(med, 2);
  for (let i = 2; i <= 6; i++) w.put(document.getElementById('it' + i).checked ? 1 : 0, 1);
  w.put(+document.getElementById('sword').value, 2);
  w.put(+document.getElementById('armor').value, 2);
  w.put(+document.getElementById('shield').value, 2);
  w.put(document.getElementById('eq3').checked ? 1 : 0, 1);
  w.put(document.getElementById('eq4').checked ? 1 : 0, 1);
  w.put(document.getElementById('eq5').checked ? 1 : 0, 1);
  w.put(document.getElementById('mapFlag').checked ? 1 : 0, 1);
  w.put(document.getElementById('keyFlag').checked ? 1 : 0, 1);
  w.put(0, 3); // $2E5E
  w.put(bombMax, 2);
  w.put(0, 6); // checksum slot

  // Block 1 (48 bits)
  w.put(rand6(), 6);
  w.put(gold % 10, 4);
  w.put(Math.floor(gold / 10) % 10, 4);
  w.put(Math.floor(gold / 100) % 10, 4);
  w.put(bombs % 10, 4);
  w.put(Math.floor(bombs / 10) % 10, 4);
  w.put(0, 8); // $2A45
  w.put(0, 8); // $2A46
  w.put(0, 6); // checksum slot

  // Block 2 (48 bits)
  w.put(rand6(), 6);
  w.put(0, 8); // $2A47
  w.put(0, 8); // $2A48
  w.put(0, 8); // $2A49
  w.put(0, 3); // $2E5F
  w.put(life, 4);
  w.put(document.getElementById('spFlag').checked ? 1 : 0, 1);
  w.put(0, 4); // padding
  w.put(0, 6); // checksum slot

  // 暗号化（各ブロックごとにチェックサム・連鎖XOR・テーブルXOR）
  const buf = w.buf;
  for (let blk = 0; blk < 3; blk++) {
    const base = blk * 8;
    let sum = 0;
    for (let i = 0; i <= 6; i++) sum = (sum + buf[base + i]) & 0xFF;
    buf[base + 7] = sum & 0x3F;
    for (let i = 0; i <= 5; i++) buf[base + i + 1] ^= buf[base + i];
    let y = buf[base];
    for (let i = 0; i <= 6; i++) {
      buf[base + 1 + i] ^= TABLE[y];
      y = (y + 1) & 0x3F;
    }
  }

  const str = buf.map(v => CHARS[v]).join('');
  document.getElementById('pwOutput').textContent =
    str.slice(0, 12).replace(/(.{4})/g, '$1 ').trim() + '\n' +
    str.slice(12, 24).replace(/(.{4})/g, '$1 ').trim();
}

function decodeInput() {
  const status = document.getElementById('decodeStatus');
  const raw = document.getElementById('pwInput').value.replace(/\s+/g, '');
  if (raw.length !== 24) {
    status.className = 'status err';
    status.textContent = `エラー: 24文字で入力してください（現在 ${raw.length} 文字）`;
    return;
  }
  const buf = [];
  for (const ch of raw) {
    const idx = CHARS.indexOf(ch);
    if (idx < 0) {
      status.className = 'status err';
      status.textContent = `エラー: 使用できない文字「${ch}」が含まれています`;
      return;
    }
    buf.push(idx);
  }

  // 復号＆チェックサム検証
  for (let blk = 0; blk < 3; blk++) {
    const base = blk * 8;
    let y = buf[base];
    for (let i = 0; i <= 6; i++) {
      buf[base + 1 + i] ^= TABLE[y];
      y = (y + 1) & 0x3F;
    }
    for (let i = 5; i >= 0; i--) buf[base + i + 1] ^= buf[base + i];
    let sum = 0;
    for (let i = 0; i <= 6; i++) sum = (sum + buf[base + i]) & 0xFF;
    if ((sum & 0x3F) !== buf[base + 7]) {
      status.className = 'status err';
      status.textContent = `エラー: ブロック ${blk + 1} のチェックサムが一致しません`;
      return;
    }
  }

  // 逆順ビット読み出し
  const r = createReader(buf);
  r.get(10); // checksum(6) + pad(4)
  document.getElementById('spFlag').checked = !!r.get(1);
  document.getElementById('life').value = r.get(4);
  r.get(3); // $2E5F
  r.get(8); r.get(8); r.get(8); // $2A49-$2A47
  r.get(12); // seed2(6) + blk1 checksum(6)
  r.get(8); r.get(8); // $2A46-$2A45
  const b10 = r.get(4), b1 = r.get(4);
  document.getElementById('bombs').value = b10 * 10 + b1;
  const g100 = r.get(4), g10 = r.get(4), g1 = r.get(4);
  document.getElementById('gold').value = g100 * 100 + g10 * 10 + g1;
  r.get(12); // seed1(6) + blk0 checksum(6)
  document.getElementById('bombMax').value = r.get(2);
  r.get(3); // $2E5E
  document.getElementById('keyFlag').checked = !!r.get(1);
  document.getElementById('mapFlag').checked = !!r.get(1);
  document.getElementById('eq5').checked = !!r.get(1);
  document.getElementById('eq4').checked = !!r.get(1);
  document.getElementById('eq3').checked = !!r.get(1);
  document.getElementById('shield').value = r.get(2);
  document.getElementById('armor').value = r.get(2);
  document.getElementById('sword').value = r.get(2);
  for (let i = 6; i >= 2; i--) document.getElementById('it' + i).checked = !!r.get(1);
  document.getElementById('medicine').value = r.get(2);
  document.getElementById('it0').checked = !!r.get(1);
  for (let i = 7; i >= 0; i--) document.getElementById('med' + i).checked = !!r.get(1);
  document.getElementById('area').value = r.get(4);

  status.className = 'status';
  status.textContent = '解析成功！各パラメータに反映しました。';
  generate();
}

function setMax() {
  document.getElementById('life').value = 15;
  document.getElementById('gold').value = 999;
  document.getElementById('bombs').value = 20;
  document.getElementById('bombMax').value = 3;
  document.getElementById('sword').value = 0;
  document.getElementById('armor').value = 0;
  document.getElementById('shield').value = 0;
  document.getElementById('medicine').value = 2;
  for (let i = 0; i < 8; i++) document.getElementById('med' + i).checked = true;
  ['it0','it2','it3','it4','it5','it6','eq3','eq4','eq5','mapFlag','keyFlag'].forEach(id => {
    document.getElementById(id).checked = true;
  });
  generate();
}

function copyPw() {
  const txt = document.getElementById('pwOutput').textContent.replace(/\s+/g, '');
  navigator.clipboard.writeText(txt);
}

generate();
</script>
</body>
</html>
